name: fix-system-inconsistencies-v2
description: "Comprehensive workflow to address all 27 identified inconsistencies in the Context Workflow System documentation, schemas, and agent prompts"
version: 1.0.0

parameters:
  SYSTEM_ROOT:
    type: directory
    required: true
    default: ".claude"
    description: "Root directory of the workflow system"

  DOCS_DIR:
    type: directory
    required: false
    default: ".claude/docs"
    description: "Documentation directory"

  SCHEMAS_DIR:
    type: directory
    required: false
    default: ".claude/schemas"
    description: "Schemas directory"

  AGENTS_DIR:
    type: directory
    required: false
    default: ".claude/agents/workflow"
    description: "Agent prompts directory"

  COMMANDS_DIR:
    type: directory
    required: false
    default: ".claude/commands"
    description: "Commands directory"

  TEMPLATES_DIR:
    type: directory
    required: false
    default: ".claude/templates"
    description: "Templates directory"

  DRY_RUN:
    type: boolean
    required: false
    default: false
    description: "If true, only report what would be changed without making edits"

phases:
  require_confirmation: true
  allow_retry: true
  generate_logs: true
  stop_on_failure: true

metadata:
  generated_from:
    - "Technical inconsistency analysis report"
  generated_date: "2025-01-13"
  workflow_type: automation
  complexity: complex
  supported_agents:
    - phase-executor
  architecture_notes:
    - "Addresses 27 identified inconsistencies across 4 severity levels"
    - "Must be executed sequentially - later phases depend on earlier fixes"
    - "Creates backup before modifications"
    - "Includes validation phase at end"
