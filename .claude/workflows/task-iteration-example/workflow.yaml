name: task-iteration-example
description: "Demonstrates task iteration for processing multiple independent items efficiently without context exhaustion"
version: 1.0.0

parameters:
  OUTPUT_DIR:
    type: directory
    required: true
    description: "Output directory for workflow results and task files"
    default: "./task-iteration-output"

  TASK_COUNT:
    type: integer
    required: false
    description: "Number of example tasks to generate in phase 1"
    default: 5
    min: 1
    max: 20

  TASK_INDEX_PATH:
    type: file
    required: false
    description: "Path to task index file (generated by phase 1)"

phases:
  require_confirmation: false
  allow_retry: true
  generate_logs: true
  stop_on_failure: false
  parallel_execution_supported: false
  default_model: sonnet

task_iteration:
  enabled: true
  phase: 2
  task_index_param: TASK_INDEX_PATH
  task_id_param: TASK_ID
  task_dir: "tasks"
  result_dir: "task-results"
  max_retries_per_task: 1
  stop_on_failure: false
  sequential: true

metadata:
  generated_date: "2025-12-18"
  workflow_type: automation
  complexity: simple
  architecture_notes:
    - "Phase 1 generates task index and task definition files"
    - "Phase 2 iterates over tasks using task_iteration feature"
    - "Phase 3 aggregates results and generates summary"
    - "Demonstrates resumption and dependency tracking"
