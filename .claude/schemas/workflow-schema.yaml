# JSON Schema for workflow.yaml validation
# This schema defines the structure and validation rules for workflow configuration files
$schema: http://json-schema.org/draft-07/schema#
# Local identifier for schema references (not a resolvable URL)
$id: urn:claude-workflow:schema:workflow:v1
title: Workflow Configuration Schema
description: Schema for validating Claude workflow configuration files
type: object
required:
  - name
  - description
  - version
properties:
  name:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: Workflow identifier in kebab-case
    minLength: 3
    maxLength: 50
    examples:
      - requirements-to-specs
      - technical-planning
      - database-migration
  
  description:
    type: string
    description: Human-readable description of the workflow's purpose
    minLength: 10
    maxLength: 500
  
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: Semantic version (X.Y.Z)
    examples:
      - "1.0.0"
      - "2.1.3"
  
  parameters:
    oneOf:
      - type: object
        description: Parameters as object with nested properties
        patternProperties:
          "^[A-Z][A-Z0-9_]*$":
            $ref: "#/definitions/parameterObject"
        additionalProperties: false
      - type: array
        description: Parameters as array of parameter objects
        items:
          $ref: "#/definitions/parameterArray"
        minItems: 0
        uniqueItems: true
  
  phases:
    type: object
    description: Phase execution configuration
    properties:
      require_confirmation:
        type: boolean
        description: Require user confirmation before each phase
        default: false
      
      allow_retry:
        type: boolean
        description: Allow retrying failed phases
        default: true
      
      generate_logs:
        type: boolean
        description: Generate execution.log file
        default: true
      
      stop_on_failure:
        type: boolean
        description: Stop workflow on phase failure
        default: true
      
      parallel_execution_supported:
        type: boolean
        description: Workflow contains phases that support parallel execution
        default: false

    additionalProperties: false
  
  metadata:
    type: object
    description: Workflow metadata and documentation
    properties:
      generated_from:
        type: array
        description: Source files used to generate this workflow
        items:
          type: string
        minItems: 0
      
      generated_date:
        type: string
        description: ISO date when workflow was generated
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      
      workflow_type:
        type: string
        description: Category of workflow
        enum:
          - deployment
          - testing
          - migration
          - build
          - data-processing
          - requirements-processing
          - technical-planning
          - setup
          - automation
      
      complexity:
        type: string
        description: Workflow complexity level
        enum:
          - simple
          - medium
          - complex
      
      supported_agents:
        type: array
        description: List of specialized agents used by this workflow
        items:
          type: string
        minItems: 0
        uniqueItems: true
      
      architecture_notes:
        type: array
        description: Important architectural constraints or notes
        items:
          type: string
        minItems: 0
    
    additionalProperties: true

additionalProperties: false

definitions:
  parameterObject:
    type: object
    required:
      - type
      - description
    properties:
      type:
        type: string
        enum:
          - string
          - boolean
          - integer
          - number
          - enum
          - file
          - directory
          - array
        description: Parameter data type
      
      required:
        type: boolean
        description: Whether this parameter is required
        default: false
      
      description:
        type: string
        description: Human-readable description of the parameter
        minLength: 5
        maxLength: 200
      
      default:
        description: Default value if not provided
      
      enum:
        type: array
        description: Valid values for enum type
        items:
          type: string
        minItems: 2
        uniqueItems: true
      
      example:
        description: Example value for documentation
      
      min:
        type: number
        description: Minimum value for integer/number types
      
      max:
        type: number
        description: Maximum value for integer/number types
      
      pattern:
        type: string
        description: Regex pattern for string validation
    
    allOf:
      - if:
          properties:
            type:
              const: enum
          required:
            - type
        then:
          required:
            - enum

    additionalProperties: false

  parameterArray:
    type: object
    required:
      - name
      - type
      - description
    properties:
      name:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        description: Parameter name in UPPER_SNAKE_CASE
      
      type:
        type: string
        enum:
          - string
          - boolean
          - integer
          - number
          - enum
          - file
          - directory
          - array
        description: Parameter data type
      
      required:
        type: boolean
        description: Whether this parameter is required
        default: false
      
      description:
        type: string
        description: Human-readable description of the parameter
        minLength: 5
        maxLength: 200
      
      default:
        description: Default value if not provided
      
      enum:
        type: array
        description: Valid values for enum type
        items:
          type: string
        minItems: 2
        uniqueItems: true
      
      example:
        description: Example value for documentation

    allOf:
      - if:
          properties:
            type:
              const: enum
          required:
            - type
        then:
          required:
            - enum

    additionalProperties: false